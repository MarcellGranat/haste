[package]
name = "hasted"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "hasted"
path = "src/main.rs"

[features]
# Real Gmail connector (reqwest + Keychain). Off by default so the daemon builds without it.
gmail = ["dep:haste-connector-gmail"]
# Real iCloud Mail connector (IMAP over TLS + Keychain). Off by default.
icloud = ["dep:haste-connector-icloud"]
# Real Google Calendar connector (Calendar API + Keychain). Off by default.
gcal = ["dep:haste-connector-gcal", "dep:haste-google-oauth"]
# Beeper connectors (WhatsApp, Messenger, iMessage through Beeper Desktop's local API). Off by default.
beeper = ["dep:haste-connector-beeper", "dep:haste-google-oauth"]

[dependencies]
haste-connector-gmail = { workspace = true, optional = true }
haste-connector-icloud = { workspace = true, optional = true }
haste-connector-gcal = { workspace = true, optional = true }
haste-connector-beeper = { workspace = true, optional = true }
haste-google-oauth = { workspace = true, optional = true }
haste-connector-reminders.workspace = true
haste-core.workspace = true
haste-herdr.workspace = true
haste-proto.workspace = true
haste-store.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
sha2.workspace = true

[dev-dependencies]
haste-connector-gcal.workspace = true
haste-connector-beeper.workspace = true
haste-google-oauth.workspace = true
haste-connector-gmail.workspace = true
haste-connector-icloud.workspace = true
base64.workspace = true
tempfile.workspace = true

[lints]
workspace = true
