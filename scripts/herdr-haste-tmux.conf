# A tmux that only holds haste-tui so it keeps running when the Herdr popup is closed: no bar, no
# prefix key, no bindings, so every key goes to the TUI.
set -g status off
set -g prefix None
set -g prefix2 None
unbind-key -a
set -s escape-time 0
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB:hyperlinks"
set -g extended-keys on
set -g focus-events on
set -g window-size latest
set -g destroy-unattached off
